# Defense Spending Intel — Railway cron worker.
#
# Runs daily at 04:00 UTC = 23:00 prior-day CT, after USAspending's own daily
# refresh has settled. Slot chosen to sit clear of the other crons in this
# project: sam-ingest 11:00, recompete-ai 12:00, regulatory-ai 13:00.
# ⚠ Stale as of 2026-08-22: sam-ingest has no Railway service (only this file's
# sibling toml), and recompete-ai/regulatory-ai are parked alongside this one.
#
# Configure in the Railway dashboard: Root Directory = agents/defense-spending,
# Watch Paths = agents/defense-spending/**.
#
# NAICS_CODES is a service variable, not a default in code: the set it pulls is
# the union of every customer's capability-statement codes, and a page scoped to
# a code this worker has never pulled says so rather than showing another code's
# figures.

[build]
buildCommand = ""

[deploy]
startCommand = "npx tsx index.ts"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
# PARKED 2026-08-22 on CEO instruction. "0 0 29 2 *" fires 2028-02-29 and is the
# parking value because Railway VALIDATES the expression: the obvious "0 0 31 2 *"
# (Feb 31, never fires) is REJECTED as an invalid cron and the previous schedule
# simply stays live. See ceo/agent-fleet-review.md. Restore "0 4 * * *" to resume.
cronSchedule = "0 0 29 2 *"
