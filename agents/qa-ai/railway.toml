# QA AI — Railway cron worker.
# Runs every 30 min · checks all 3 domains · Telegram-alerts on regression.
# Configure with Root Directory = agents/qa-ai (NOT / — same misconfig that
# tripped sam-ingest and the since-deleted audit-ai fork when the GitHub
# source defaulted to repo root and Nixpacks rebuilt Next.js).

[build]
buildCommand = ""

[deploy]
startCommand = "npx tsx index.ts"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
cronSchedule = "0 0 31 2 *"  # PARKED 2026-07-07 — Feb-31 never fires (never-run); restore "*/30 * * * *" to resume
