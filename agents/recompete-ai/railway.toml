# Recompete AI — Railway cron worker.
# Runs daily at 12:00 UTC = 07:00 CDT. (The 07:00 slot originally followed the
# audit-ai 06:30 CDT cron, deleted 2026-06-28 · 5dc9b18 — no ordering
# dependency remains.)
# Configure Root Directory = agents/recompete-ai in Railway dashboard.
# nixpacks.toml in this directory disables the build phase explicitly.

[build]
buildCommand = ""

[deploy]
startCommand = "npx tsx index.ts"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
# PARKED 2026-08-22 on CEO instruction. "0 0 29 2 *" fires 2028-02-29 and is the
# parking value because Railway VALIDATES the expression: the obvious "0 0 31 2 *"
# (Feb 31, never fires) is REJECTED as an invalid cron and the previous schedule
# simply stays live. See ceo/agent-fleet-review.md. Restore "0 12 * * *" to resume.
cronSchedule = "0 0 29 2 *"
