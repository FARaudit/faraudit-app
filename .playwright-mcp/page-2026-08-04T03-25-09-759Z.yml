        - generic [ref=f4e77]: "FAR (Federal Acquisition Regulation) applies to all federal procurement. DFARS (Defense FAR Supplement) layers DoD-specific rules on top. If your solicitation cites a DFARS clause, treat it as authoritative for DoD work; FAR fills the gaps. Common DFARS pain points: 252.204-7012 (covered defense info safeguarding), 252.225-7001 (Buy American), 252.225-7048 (export control)."
