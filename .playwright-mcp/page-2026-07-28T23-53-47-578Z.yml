  - generic [ref=e547]: Titles — LinkedIn’s per-post export has no title field. Every title here is derived from the URL slug (LinkedIn’s slugification of the opening line), marked ~, and never presented as authoritative. Posts whose slug is a run of hashtags are shown as Untitled + date.Absent ≠ zero — a missing sheet renders as “not in export”. On the daily chart, zero-reach days draw nothing at all rather than a bar of height zero.Scale — demographic bars are scaled to the top share within their group and the top share is printed beside the group title. Organisations are listed without bars because their shares are 2% and below.Source — ceo/linkedin/exports/ · record ceo/linkedin-analytics.json · schema linkedin-analytics.v2. This page renders entirely from the inlined JSON block; the ingest replaces that block and nothing else.