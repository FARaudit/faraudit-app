  - paragraph [ref=f4e120]:
    - text: "Two containers ship: the PDF and the copy. The"
    - code [ref=f4e121]: .docx
    - text: was cut, because the paste already delivers an editable Word document — pasting into Word gives you the table, the styling and a file you can edit, so a separate download added a file rather than a capability. It also carried the whole card-821 defect surface (A4 instead of Letter, sizes under the floor, headings smaller than body, an empty
    - code [ref=f4e122]: docDefaults
    - text: "), and cutting it deletes that surface instead of scheduling it for repair. The third pane stays as evidence, not as a deliverable: it is the copy bytes rendered at the measure and in the faces Word actually gives them. A clipboard carries markup and no fonts, so the reader reads it in whatever they have — press AS IT ARRIVES to see that honestly, Calibri and Consolas in a 6.5in Letter column. If the document only works in its own typeface at its own width, it does not work."
  - heading "§02 · what carries, what degrades, and why" [level=2] [ref=f4e123]
