<!doctype html>
<html lang="en" data-theme="light" data-sb="open">
<head>
<meta charset="utf-8" />
<title>FARaudit — Opportunities</title>
<meta name="viewport" content="width=device-width,initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=Fraunces:ital,opsz,wght@1,72,500;1,72,600&display=swap" rel="stylesheet" />
<style>
/* ── tokens: copied verbatim from the live tab file, plus ROLE-NAMED additions ── */
:root{
  --accent:#378ADD; --accent-deep:#185FA5; --accent-light:#B5D4F4; --accent-pale:#E6F1FB;
  --navy-900:#050d1a; --navy-800:#0A1628; --navy-700:#142545;
  --green-50:#ecfdf5; --green-100:#d1fae5; --green-200:#a7f3d0; --green-500:#10b981; --green-600:#059669; --green-700:#047857; --green-800:#065f46;
  --red-50:#fef2f2; --red-100:#fee2e2; --red-200:#fecaca; --red-500:#ef4444; --red-600:#dc2626; --red-700:#b91c1c;
  --amber-50:#fffbeb; --amber-100:#fef3c7; --amber-200:#fde68a; --amber-600:#d97706; --amber-700:#b45309; --amber-800:#92400e;
  --purple-100:#ede9fe; --purple-600:#7c3aed; --purple-700:#6d28d9;
}
:root,[data-theme="light"],[data-theme="auto"]{
  --page-bg:#eef2f7; --bg:#f0f4f8; --card:#ffffff; --card-soft:#fafcfe;
  --ink:#0A1628; --ink-2:#334155; --mute:#64748b; --mute-2:#94a3b8;
  --line:#e5e7eb; --line-2:#eef2f6; --line-3:#f1f5f9; --search-bg:#f1f5f9;
  --shadow:0 1px 2px rgba(15,23,42,.06), 0 8px 24px -12px rgba(15,23,42,.10);
  --shadow-sm:0 1px 3px rgba(0,0,0,0.06);
  --shadow-pop:0 24px 60px -22px rgba(15,23,42,.28), 0 6px 16px -6px rgba(15,23,42,.12);
  /* ROLE tokens. Never hue-named: --barred is red today and the name still
     holds if it stops being red. */
  --eligible-bg:var(--accent-pale); --eligible-ink:var(--accent-deep); --eligible-line:var(--accent-light);
  --open-bg:var(--card-soft); --open-ink:#4b5563; --open-line:var(--line);
  --barred-bg:var(--red-50); --barred-ink:var(--red-700); --barred-line:var(--red-200);
  --unread-bg:var(--amber-50); --unread-ink:var(--amber-800); --unread-line:var(--amber-200);
  --verified-bg:var(--green-50); --verified-ink:var(--green-800); --verified-line:var(--green-200);
  /* --tertiary is NOT --mute: #64748b clears 4.5:1 on --card (4.76) but only
     reaches 4.31 on --bg, and the page header sits on --bg. A token verified
     against one ground is not verified. */
  --rule:var(--line); --tertiary:#5b6a7d;
}
[data-theme="dark"]{
  --page-bg:#02060c; --bg:#050d1a; --card:#0c1b30; --card-soft:#0a1729;
  --ink:#e8eef6; --ink-2:#b6c2d3; --mute:#7d8ba0; --mute-2:#5b6778;
  --line:rgba(255,255,255,0.08); --line-2:rgba(255,255,255,0.05); --line-3:rgba(255,255,255,0.04); --search-bg:rgba(255,255,255,0.04);
  --shadow:0 1px 2px rgba(0,0,0,.5), 0 8px 24px -12px rgba(0,0,0,.6);
  --shadow-sm:0 1px 3px rgba(0,0,0,0.5);
  --shadow-pop:0 1px 2px rgba(0,0,0,.5), 0 28px 64px -22px rgba(0,0,0,.85);
  --eligible-bg:rgba(55,138,221,.16); --eligible-ink:#a9cdf3; --eligible-line:rgba(181,212,244,.34);
  --open-bg:rgba(255,255,255,.05); --open-ink:#a3b0c2; --open-line:rgba(255,255,255,.12);
  --barred-bg:rgba(220,38,38,.16); --barred-ink:#fca5a5; --barred-line:rgba(220,38,38,.4);
  --unread-bg:rgba(217,119,6,.16); --unread-ink:#fcd34d; --unread-line:rgba(252,211,77,.36);
  --verified-bg:rgba(16,185,129,.16); --verified-ink:#86efac; --verified-line:rgba(16,185,129,.36);
  --rule:var(--line); --tertiary:var(--mute);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--page-bg);font-family:"Manrope",ui-sans-serif,system-ui,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
button{font-family:inherit}
/* Default link colours are declared at ZERO specificity via :where(), so a link
   that is also a component (.btn-open, .sb-icon) keeps its own colour. Written
   plainly, `[data-theme="dark"] a` is 0-1-1 and silently repainted the primary
   button's label to --accent-light: 4.25:1 on the one control the page exists
   to drive. Fix the selector's reach, never the declaration. */
:where(a){color:var(--accent-deep);text-decoration:none}
:where(a:hover){color:var(--accent);text-decoration:underline}
:where([data-theme="dark"]) :where(a){color:var(--accent-light)}
:where([data-theme="dark"]) :where(a:hover){color:#fff}
.mono{font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace;font-variant-numeric:tabular-nums}
.frame{width:100%;max-width:1800px;min-width:0;margin:0 auto;background:var(--bg);display:grid;grid-template-columns:var(--sb-width) 1fr;min-height:100vh;align-items:stretch}
.main{display:flex;flex-direction:column;min-width:0}
.topbar{height:60px;background:var(--card);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:18px;padding:0 24px;position:sticky;top:0;z-index:60}
.crumbs{display:flex;align-items:center;gap:8px;color:var(--tertiary);font-size:13px;font-weight:500;white-space:nowrap}
.crumbs b{color:var(--ink);font-weight:700}
.crumbs .sep{color:var(--tertiary)}
.live-pill{display:inline-flex;align-items:center;gap:7px;height:24px;padding:0 10px;border-radius:999px;background:var(--verified-bg);color:var(--verified-ink);font-size:11.5px;font-weight:700;letter-spacing:.02em;border:1px solid var(--verified-line);white-space:nowrap}
.live-pill::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--green-500);box-shadow:0 0 0 3px rgba(16,185,129,.18);animation:pulse 1.6s ease-out infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(16,185,129,.45)}100%{box-shadow:0 0 0 8px rgba(16,185,129,0)}}
/* The three feed states are the honest-state affordance this page exists to
   protect — carried forward from the served stylesheet onto the role tokens.
   Dropping them would render FEED UNAVAILABLE in the green "live" register. */
.live-pill.wait{background:var(--open-bg);color:var(--open-ink);border-color:var(--open-line)}
.live-pill.wait::before{background:currentColor;box-shadow:none;animation:none;opacity:.6}
.live-pill.err{background:var(--barred-bg);color:var(--barred-ink);border-color:var(--barred-line)}
.live-pill.err::before{background:currentColor;box-shadow:none;animation:none}
.tb-search{margin-left:auto;display:flex;align-items:center;gap:10px;height:34px;width:300px;min-width:170px;padding:0 12px;border-radius:9px;background:var(--search-bg);border:1px solid var(--line);color:var(--tertiary);font-size:13px;cursor:pointer;text-align:left;white-space:nowrap}
.tb-search .kbd{margin-left:auto;font-family:"IBM Plex Mono";font-size:11px;color:var(--tertiary);background:var(--card);border:1px solid var(--line);border-radius:5px;padding:1px 6px}
.top-actions{display:flex;align-items:center;gap:8px}
.icon-btn{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;color:var(--ink-2);cursor:pointer;position:relative}
.icon-btn svg{width:16px;height:16px}
.icon-btn .nbadge{position:absolute;top:-4px;right:-4px;background:var(--red-600);color:#fff;font-size:11px;font-weight:800;height:16px;min-width:16px;border-radius:8px;display:grid;place-items:center;padding:0 4px;border:2px solid var(--card);line-height:1}
.user-chip{height:34px;padding:0 10px 0 4px;border-radius:9px;border:1px solid var(--line);background:var(--card);display:flex;align-items:center;gap:8px}
.user-chip .av{width:24px;height:24px;border-radius:6px;background:var(--navy-700);color:#fff;display:grid;place-items:center;font-size:11px;font-weight:700}
.user-chip .nm{font-size:12.5px;font-weight:700;color:var(--ink);line-height:1.1;white-space:nowrap}
.body{padding:24px 32px 56px;display:flex;flex-direction:column;gap:16px;max-width:1520px;width:100%;margin:0 auto}

/* ── header + profile surface ── */
.page-header{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:24px;align-items:end}
.heading{display:flex;flex-direction:column;gap:6px;min-width:0}
.eyebrow{font-family:"IBM Plex Mono",monospace;font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--accent-deep);margin:0}
[data-theme="dark"] .eyebrow{color:var(--accent-light)}
.page-header h1{font-family:"Fraunces","Georgia",serif;font-style:italic;font-weight:600;font-size:34px;letter-spacing:-.02em;color:var(--ink);margin:0;line-height:1.04}
.sub{font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--tertiary);margin:0;line-height:1.5}
/* .sub sets IBM Plex Mono, so `inherit` here resolves to mono — the control
   must name the body face explicitly to match .prof-gap button. */
.sub button{margin-left:9px;border:0;background:var(--unread-ink);color:var(--card);font-family:"Manrope",ui-sans-serif,system-ui,sans-serif;font-size:11px;font-weight:800;padding:5px 10px;border-radius:7px;cursor:pointer;white-space:nowrap;vertical-align:baseline}
.sub b{color:var(--ink-2);font-weight:600}
.profile{display:flex;flex-direction:column;align-items:flex-end;gap:7px;flex-shrink:0;max-width:470px}
.prof-label{font-family:"IBM Plex Mono",monospace;font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--tertiary);font-weight:700;line-height:1.5;white-space:nowrap}
.prof-label b{color:var(--accent-deep);font-weight:700}
[data-theme="dark"] .prof-label b{color:var(--accent-light)}
.prof-pills{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.npill{font-family:"IBM Plex Mono",monospace;font-size:11.5px;font-weight:600;padding:4px 11px;border-radius:20px;border:1px solid var(--eligible-line);background:var(--eligible-bg);color:var(--eligible-ink);cursor:pointer;user-select:none;display:inline-flex;align-items:center;gap:6px}
.npill::before{content:"";width:5px;height:5px;border-radius:50%;background:currentColor;flex-shrink:0}
.npill.off{border-color:var(--line);background:transparent;color:var(--tertiary);border-style:dashed}
.prof-gap{display:flex;align-items:center;gap:9px;padding:7px 11px;border-radius:9px;background:var(--unread-bg);border:1px dashed var(--unread-line);color:var(--unread-ink);font-size:11.5px;font-weight:600;line-height:1.35;max-width:100%}
.prof-gap button{border:0;background:var(--unread-ink);color:var(--card);font-size:11px;font-weight:800;padding:5px 10px;border-radius:7px;cursor:pointer;white-space:nowrap;flex-shrink:0}

/* ── controls ── */
/* align-items:center is held back by .ctl-label{align-self:start}. Removing
   that override re-centres labels against a wrapped pillset. */
.controls{display:grid;grid-template-columns:104px minmax(0,1fr);column-gap:16px;row-gap:11px;align-items:center;padding:14px 16px;background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow-sm)}
.controls > .seg,.controls > .ctl-field{justify-self:stretch;min-width:0}
.ctl-field{display:flex;align-items:center;gap:12px;row-gap:7px;flex-wrap:wrap}
.ctl-field > .seg{flex:1 1 100%;min-width:0}
.ctl-sep{grid-column:1/-1;justify-self:stretch;height:1px;background:var(--line-2)}
.ctl-label{font-family:"IBM Plex Mono",monospace;font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--tertiary);white-space:nowrap;text-align:left;align-self:start;margin-top:7px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;background:var(--card);overflow:hidden;flex-wrap:wrap}
.seg button{background:transparent;border:0;border-right:1px solid var(--line);cursor:pointer;font-family:"IBM Plex Mono",monospace;font-size:11px;font-weight:700;color:var(--ink-2);padding:6px 11px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.seg button:last-child{border-right:0}
.seg button .n{font-size:11px;font-weight:600;color:var(--tertiary)}
/* Active = a TINT over the unchanged card surface, never a solid fill. */
.seg button.active{background:linear-gradient(0deg,var(--eligible-bg),var(--eligible-bg)),var(--card);color:var(--eligible-ink);box-shadow:inset 0 -2px 0 var(--eligible-ink)}
.seg button.active .n{color:inherit}
/* Zero-count buckets stay VISIBLE and muted — deleting one hides that the feed contains none of it. */
.seg button.zero{opacity:.55;font-weight:600}
.pillset{display:flex;align-items:stretch;gap:8px;flex-wrap:wrap}
/* Inside the filter panel both axes are LOOSE CELLS of one module, not joined
   controls. With no enclosing box to be flush with and no free space to
   distribute, a dangling seam on wrap, rails of unequal width and a muted
   zero-count bucket inflated past the real values are impossible rather than
   merely absent. Row 1's enum is a fixed six values and defines the module; row 2
   lays five of the same cell and ends one short, which is a true statement about
   the data. --cell-floor is MEASURED from every declared label (see setCellFloor),
   never chosen from whichever labels happen to be visible. */
.controls .seg{display:flex;flex-wrap:wrap;gap:6px;background:transparent;border:0;border-radius:0;overflow:visible}
.controls .seg button{flex:0 0 max(var(--cell-floor,138px),calc((100% - 30px)/6));min-width:0;border:1px solid var(--line);border-radius:8px;background:var(--card);justify-content:center}
.controls .seg button.active{border-color:var(--eligible-line)}
.more-btn{font-family:"IBM Plex Mono",monospace;font-size:11px;font-weight:600;color:var(--tertiary);background:none;border:0;cursor:pointer;white-space:nowrap;padding:0;letter-spacing:.02em;align-self:flex-start}
.more-btn:hover{color:var(--accent-deep);text-decoration:underline}
.vr-right{margin-left:auto;display:flex;align-items:center;gap:12px;flex-shrink:0}
.ctl-search{display:flex;align-items:center;gap:8px;height:30px;width:230px;padding:0 11px;border-radius:8px;background:var(--card-soft);border:1px solid var(--line)}
.ctl-search svg{width:14px;height:14px;color:var(--tertiary);flex-shrink:0}
.ctl-search input{border:0;background:transparent;outline:0;font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--ink);width:100%}
.reset-btn{font-family:"IBM Plex Mono",monospace;font-size:11px;font-weight:700;color:var(--tertiary);background:none;border:0;cursor:pointer}
.reset-btn:hover{color:var(--accent-deep);text-decoration:underline}
/* Saved views are deliberately NOT the filter cell: they set several axes at once
   and are a different kind of thing. A stack of title over the axes it sets needs
   the height — two type sizes on one 29px line crams both against the top. They
   keep their natural width; stretching three chips only pushes search and Reset
   onto a second line. */
.view-chip{display:inline-flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:3px;padding:9px 14px;border-radius:10px;background:var(--card);border:1px solid var(--line);cursor:pointer;text-align:left;white-space:nowrap}
.view-chip .vc-t{font-size:12px;font-weight:700;color:var(--ink);line-height:1.2;white-space:nowrap}
.view-chip .vc-d{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--tertiary);line-height:1.25;white-space:nowrap}
.view-chip.active{background:linear-gradient(0deg,var(--eligible-bg),var(--eligible-bg)),var(--card);border-color:var(--eligible-line)}
.view-chip.active .vc-t{color:var(--eligible-ink)}

/* ── KPI ── */
.kpi-strip{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow-sm);padding:15px 18px;display:flex;flex-direction:column;gap:6px;min-width:0}
.kpi .lbl{font-family:"IBM Plex Mono",monospace;font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--tertiary);margin:0}
.kpi-val{font-family:"Manrope",sans-serif;font-size:34px;font-weight:800;letter-spacing:-.03em;color:var(--ink);line-height:.95;display:flex;align-items:baseline;gap:4px}
.kpi-val .unit{font-size:15px;font-weight:700;color:var(--tertiary);letter-spacing:0}
.kpi .foot{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--tertiary);line-height:1.45}

/* ── widgets ── */
.row{display:grid;gap:16px;align-items:stretch}
.row.hero{grid-template-columns:1.42fr 1fr}
/* Media rules OUT-SPECIFY their base rule (html …) — equal specificity would
   lose on source order and the narrow path would never run. */
@media(max-width:1320px){html .row.hero{grid-template-columns:1fr}}
@media(max-width:1180px){
  html .kpi-strip{grid-template-columns:repeat(2,1fr)}
  html .page-header{grid-template-columns:minmax(0,1fr)}
  html .profile{align-items:flex-start;max-width:100%}
  html .prof-pills{justify-content:flex-start}
  html .body{padding:20px 20px 48px}
  html .pcard{grid-template-columns:var(--when-w) minmax(0,1fr) 118px;grid-template-areas:"when main act" "when state act";row-gap:9px}
  /* §7k leaves ONE rail rule at narrow: loose cells need no other. */
  html .controls{grid-template-columns:minmax(0,1fr);row-gap:5px}
  html .ctl-label{margin-top:7px}
  html .more-btn{flex:0 0 auto}
  html .ctl-sep{margin:6px 0}
  html .pc-state{flex-direction:row;align-items:center;flex-wrap:wrap;gap:6px 10px}
  html .crumbs .sep,html .crumbs>span:last-child{display:none}
  html .tb-search{width:auto;min-width:0;flex:1 1 120px}
}
@media(max-width:1000px){html .user-chip .nm{display:none}}
.widget{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow-sm);padding:17px 20px;display:flex;flex-direction:column;gap:13px;min-width:0}
.widget-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-shrink:0}
.wh-text h3{font-family:"Manrope",sans-serif;font-size:15px;font-weight:800;letter-spacing:-.01em;color:var(--ink);margin:0;line-height:1.2}
.wh-text .wh-sub{font-size:12px;color:var(--tertiary);margin:2px 0 0;line-height:1.4}
.wh-source{font-family:"IBM Plex Mono",monospace;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--tertiary);background:var(--card-soft);border:1px solid var(--line);padding:3px 8px;border-radius:5px;white-space:nowrap;flex-shrink:0}

/* ── triage bands (the hero) ── */
.bands{display:flex;flex-direction:column}
.band{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:24px;align-items:center;padding:13px 12px;border:0;border-bottom:1px solid var(--rule);background:transparent;cursor:pointer;text-align:left;width:100%}
.band:last-of-type{border-bottom:0}
.band.active{background:linear-gradient(0deg,var(--eligible-bg),var(--eligible-bg)),var(--card)}
.band-n{font-family:"Manrope",sans-serif;font-size:30px;font-weight:800;letter-spacing:-.03em;color:var(--ink);line-height:1;text-align:right}
.band.dim .band-n{color:var(--tertiary)}
.band-t{display:block;font-size:14px;font-weight:800;color:var(--ink);letter-spacing:-.005em;line-height:1.25}
.band-r{display:block;font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--tertiary);line-height:1.45;margin-top:3px}
.band-go{font-family:"IBM Plex Mono",monospace;font-size:11px;font-weight:700;color:var(--tertiary);white-space:nowrap}
.band.active .band-go{color:var(--eligible-ink)}
.band-total{display:grid;grid-template-columns:64px minmax(0,1fr);gap:24px;align-items:baseline;padding:11px 12px 13px;border-top:2px solid var(--ink)}
.band-total .band-n{font-size:22px}
/* The funnel is a SECOND ledger and it must not borrow the band ledger's
   numbers: the rows a profile removes never enter a band, so listing them as a
   screen-out reason would put two different totals side by side. */
.funnel{display:flex;flex-direction:column;margin-top:4px;border-top:2px solid var(--ink);padding-top:9px}
.fn-row{display:grid;grid-template-columns:64px minmax(0,1fr);gap:24px;align-items:baseline;padding:5px 12px}
.fn-n{font-family:"IBM Plex Mono",monospace;font-size:13px;font-weight:700;text-align:right;color:var(--ink);font-variant-numeric:tabular-nums}
.fn-t{font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--ink-2);line-height:1.45}
.fn-row.none .fn-n,.fn-row.none .fn-t{color:var(--tertiary)}
.fn-row.sum{border-top:1px solid var(--rule);margin-top:4px;padding-top:9px}
.fn-row.sum .fn-n{font-family:"Manrope",sans-serif;font-size:20px;font-weight:800;letter-spacing:-.03em}
.fn-row.sum .fn-t{color:var(--ink);font-weight:600}
.screen-detail{padding:0 12px 12px;display:flex;flex-direction:column;gap:6px}
.sd-row{display:grid;grid-template-columns:64px minmax(0,1fr);gap:24px;font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--ink-2);line-height:1.5}
.sd-row .sd-n{text-align:right;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums}
.sd-row.none .sd-n,.sd-row.none{color:var(--tertiary)}
.sd-row a{font-weight:700}

/* ── closing-first list ── */
.act-list{display:flex;flex-direction:column;gap:1px;background:var(--rule);border:1px solid var(--rule);border-radius:10px;overflow:hidden}
.act-foot{margin-top:auto;padding-top:11px;border-top:1px solid var(--rule);font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--tertiary);line-height:1.45}
.act-row{display:grid;grid-template-columns:62px minmax(0,1fr) auto;gap:20px;align-items:center;padding:9px 11px;background:var(--card);cursor:pointer;border:0;text-align:left;width:100%}
.act-row:hover{background:var(--card-soft)}
.act-d{font-family:"Manrope",sans-serif;font-size:22px;font-weight:800;letter-spacing:-.03em;color:var(--ink);text-align:right;line-height:1;font-variant-numeric:tabular-nums;white-space:nowrap}
.act-d small{font-family:"IBM Plex Mono",monospace;font-size:11.5px;font-weight:700;color:var(--tertiary);letter-spacing:.02em;margin-left:2.5px}
.act-row.far .act-d{color:var(--ink-2);font-weight:700}
.act-title{display:block;font-size:12.5px;font-weight:700;color:var(--ink);line-height:1.3;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.act-agy{display:block;font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--tertiary);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ── verdict + chips ── */
.vd{font-family:"IBM Plex Mono",monospace;font-size:11px;font-weight:700;letter-spacing:.09em;padding:4px 9px;border-radius:6px;white-space:nowrap;display:inline-flex;align-items:center;gap:6px;border:1px solid transparent}
.vd::before{content:"";width:7px;height:7px;flex-shrink:0}
.vd-act{background:var(--eligible-bg);color:var(--eligible-ink);border-color:var(--eligible-line)}
.vd-act::before{background:currentColor;border-radius:50%}
.vd-queue{background:var(--open-bg);color:var(--open-ink);border-color:var(--open-line)}
.vd-queue::before{background:currentColor;border-radius:50%;opacity:.5}
.vd-shape{background:var(--open-bg);color:var(--open-ink);border-color:var(--open-line)}
.vd-shape::before{border:1.5px solid currentColor;border-radius:50%;background:transparent}
.vd-assert{background:var(--barred-bg);color:var(--barred-ink);border-color:var(--barred-line)}
.vd-assert::before{background:currentColor}
.vd-read{background:var(--open-bg);color:var(--open-ink);border-color:var(--open-line);border-style:dashed}
.vd-read::before{background:currentColor;opacity:.4}
.chip{font-family:"IBM Plex Mono",monospace;font-size:11px;font-weight:700;letter-spacing:.02em;padding:3px 8px;border-radius:5px;white-space:nowrap;border:1px solid transparent;display:inline-flex;align-items:center;gap:5px}
.chip.naics{background:var(--card-soft);color:var(--ink-2);border-color:var(--line)}
.chip.psc{background:var(--card-soft);color:var(--tertiary);border-color:var(--line)}
.chip.stage{background:var(--card-soft);color:var(--ink-2);border-color:var(--line)}
/* Set-aside registers. Hue is backed by SHAPE so the encoding survives greyscale
   and colour-blindness: restricted = filled square · open = no mark ·
   sole source = filled square in the barred register · unknown = dashed border. */
.chip.sa-restricted{background:var(--eligible-bg);color:var(--eligible-ink);border-color:var(--eligible-line)}
.chip.sa-restricted::before{content:"";width:7px;height:7px;background:currentColor;flex-shrink:0}
.chip.sa-partial{background:var(--eligible-bg);color:var(--eligible-ink);border-color:var(--eligible-line)}
.chip.sa-partial::before{content:"";width:7px;height:7px;background:linear-gradient(90deg,currentColor 50%,transparent 50%);box-shadow:inset 0 0 0 1px currentColor;flex-shrink:0}
.chip.sa-open{background:var(--open-bg);color:var(--open-ink);border-color:var(--open-line)}
.chip.sa-barred{background:var(--barred-bg);color:var(--barred-ink);border-color:var(--barred-line);font-weight:700}
.chip.sa-barred::before{content:"";width:7px;height:7px;background:currentColor;flex-shrink:0}
.chip.sa-unread{background:var(--unread-bg);color:var(--unread-ink);border-color:var(--unread-line);border-style:dashed}
.chip.sa-unread::before{content:"";width:7px;height:7px;border:1.5px dashed currentColor;flex-shrink:0}

/* ── pursuit list ── */
.plist-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.plist-count{font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--tertiary)}
.plist-count b{color:var(--ink);font-weight:700}
.plist{display:flex;flex-direction:column;gap:0}
.grouphd{--when-num:62px;--when-pad:20px;--when-w:calc(var(--when-num) + var(--when-pad) + 1px);--card-inset:16px;display:grid;grid-template-columns:var(--when-w) minmax(0,1fr) auto;gap:20px;align-items:baseline;padding:16px var(--card-inset) 8px;border-bottom:1px solid var(--rule);margin-bottom:9px}
.plist > .grouphd:first-child{padding-top:2px}
.grouphd .gh-t{font-family:"IBM Plex Mono",monospace;font-size:12px;font-weight:700;letter-spacing:.11em;text-transform:uppercase;color:var(--ink);white-space:nowrap}
.grouphd .gh-n{font-family:"Manrope",sans-serif;font-size:15px;font-weight:800;color:var(--ink);letter-spacing:-.02em;text-align:right;font-variant-numeric:tabular-nums;margin-right:calc(var(--when-pad) + 1px)}
.grouphd .gh-r{font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--tertiary);text-align:right}
.pcard{--when-num:62px;--when-pad:20px;--when-w:calc(var(--when-num) + var(--when-pad) + 1px);display:grid;grid-template-columns:var(--when-w) minmax(0,1fr) 190px 118px;grid-template-areas:"when main state act";gap:20px;align-items:start;padding:13px 15px;background:var(--card);border:1px solid var(--line);border-radius:11px;box-shadow:var(--shadow-sm);margin-bottom:9px;min-width:0}
.pcard.barred{border-color:var(--barred-line)}
.pc-when{grid-area:when;text-align:right;display:flex;flex-direction:column;justify-content:center;gap:1px;padding-top:1px;align-self:stretch;padding-right:var(--when-pad);border-right:1px solid var(--rule)}
.pc-d{font-family:"Manrope",sans-serif;font-size:26px;font-weight:800;letter-spacing:-.035em;line-height:.92;color:var(--ink);font-variant-numeric:tabular-nums;white-space:nowrap}
.pc-d small{font-size:13px;font-weight:700;margin-left:3px}
.pcard.far .pc-d{color:var(--ink-2);font-weight:700}
.pcard.later .pc-d{color:var(--tertiary);font-weight:700}
.pc-when .pc-dl{font-family:"IBM Plex Mono",monospace;font-size:11px;font-weight:600;color:var(--tertiary);letter-spacing:.02em}
.pc-main{grid-area:main;min-width:0;display:flex;flex-direction:column;gap:5px}
.pc-title{font-size:14.5px;font-weight:800;color:var(--ink);letter-spacing:-.01em;line-height:1.3}
.pc-buyer{font-size:12.5px;color:var(--ink-2);line-height:1.35}
.pc-buyer b{font-weight:700;color:var(--ink)}
.pc-id{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--tertiary)}
.pc-chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:2px}
.pc-dates{display:flex;gap:14px;flex-wrap:wrap;margin-top:5px}
.pc-dates:empty{display:none}
.pc-dt{font-family:"IBM Plex Mono",monospace;font-size:10.5px;color:var(--mute);letter-spacing:.01em}
.pc-dt b{font-weight:700;color:var(--ink-2);letter-spacing:.06em;text-transform:uppercase;font-size:9px;margin-right:4px}
.pc-link{text-decoration:none;color:var(--accent)}
.pc-more{grid-column:1/-1;justify-self:start;margin-top:6px;font-family:"IBM Plex Mono",monospace;font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:3px 9px;border-radius:4px;cursor:pointer;background:transparent;color:var(--tertiary);border:1px solid var(--line)}
.pc-more:hover{color:var(--ink-2);border-color:var(--mute-2)}
.pc-detail{grid-column:1/-1;display:none;margin-top:8px;padding-top:9px;border-top:1px solid var(--line-2);flex-direction:column;gap:5px}
.pcard.is-open .pc-detail{display:flex}
.pd-row{display:grid;grid-template-columns:190px 1fr;gap:10px;align-items:baseline}
.pd-k{font-family:"IBM Plex Mono",monospace;font-size:9px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--tertiary)}
.pd-v{font-size:12px;color:var(--ink-2);word-break:break-word}
.pc-link:hover{text-decoration:underline}
.pc-state{grid-area:state;display:flex;flex-direction:column;gap:7px;align-items:flex-start;min-width:0}
.pc-note{font-size:12px;color:var(--ink-2);line-height:1.4}
.pc-actions{grid-area:act;display:flex;flex-direction:column;gap:6px}
.btn-open{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:32px;padding:0 12px;border-radius:8px;background:var(--accent-deep);color:#fff;border:0;font-size:12px;font-weight:700;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn-open:hover{background:var(--accent);color:#fff;text-decoration:none}
.btn-open.off{background:var(--card-soft);color:var(--tertiary);border:1px dashed var(--line);cursor:not-allowed}
.btn-open.off:hover{background:var(--card-soft);color:var(--tertiary)}
.btn-2{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:30px;padding:0 11px;border-radius:8px;background:var(--card);color:var(--ink-2);border:1px solid var(--line);font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap}
.btn-2::before{content:"";width:7px;height:7px;border:1.5px solid currentColor;flex-shrink:0}
.btn-2:hover{border-color:var(--accent);color:var(--accent-deep)}
/* Four states, three visual registers, separated by SHAPE so no new hue is
   spent: red still means only "you cannot compete", green only "verified
   eligibility". On-ness is carried by ink weight over the unchanged surface. */
.btn-2.on{background:linear-gradient(0deg,rgba(10,22,40,.07),rgba(10,22,40,.07)),var(--card);border-color:var(--ink-2);color:var(--ink);font-weight:800}
.btn-2.on::before{background:currentColor;border-color:currentColor}
[data-theme="dark"] .btn-2.on{background:linear-gradient(0deg,rgba(255,255,255,.09),rgba(255,255,255,.09)),var(--card)}
.btn-2.locked{border-style:dotted;cursor:not-allowed}
.btn-2.locked::after{content:"";width:9px;height:7px;border:1.5px solid currentColor;border-radius:2px;border-top-width:4px;border-top-color:transparent;box-shadow:inset 0 -1px 0 currentColor;flex-shrink:0;opacity:.75}
.btn-2.unknown{border-style:dashed;color:var(--tertiary);cursor:not-allowed;background:var(--card)}
.btn-2.unknown::before{border-style:dashed;background:transparent}
.btn-2:disabled{opacity:1}
.btn-2.locked:hover,.btn-2.unknown:hover{border-color:var(--line);color:inherit}
.empty{padding:44px 20px;text-align:center;color:var(--tertiary);font-family:"IBM Plex Mono",monospace;font-size:12.5px;line-height:1.7}
.clipmark{font-family:"IBM Plex Mono",monospace;font-size:11px;font-weight:700;color:var(--barred-ink);border-bottom:1px dotted currentColor}
.folded{display:none}

/* sidebar (canonical) */
:root{--sb-width:56px}
[data-sb="open"]{--sb-width:232px}
.sidebar{width:var(--sb-width)!important;background:#0A1628!important;color:rgba(255,255,255,.6);display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 0 18px;position:sticky;top:0;height:100vh;border-right:1px solid rgba(255,255,255,.08);flex-shrink:0;align-self:stretch;overflow:visible;transition:width .22s cubic-bezier(0.16,1,0.3,1)}
.sb-toggle{position:absolute;top:18px;right:-11px;width:22px;height:22px;border-radius:50%;background:#0A1628;border:1px solid rgba(255,255,255,.12);color:rgba(255,255,255,.6);display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:10;transition:background .14s,color .14s;box-shadow:0 2px 6px rgba(0,0,0,.25);padding:0}
.sb-toggle:hover{background:rgba(255,255,255,.06);color:#fff}
.sb-toggle svg{width:11px;height:11px;transition:transform .22s}
[data-sb="open"] .sb-toggle svg{transform:rotate(180deg)}
.sb-logo-row{display:flex;align-items:center;justify-content:center;margin-bottom:10px}
.sb-logo{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,#378ADD,#378ADD 55%,#185FA5);color:#fff;display:grid;place-items:center;font-weight:800;font-size:14px;flex-shrink:0;box-shadow:inset 0 -2px 0 rgba(0,0,0,.18),0 6px 12px -4px rgba(55,138,221,.55)}
.sb-wordmark{display:none}
[data-sb="open"] .sb-logo-row{justify-content:flex-start;gap:10px;margin:0 0 8px 4px;align-self:flex-start}
[data-sb="open"] .sb-wordmark{display:inline-flex;font-family:"Manrope",sans-serif;font-size:16px;font-weight:800;letter-spacing:-.02em;color:#fff}
[data-sb="open"] .sb-wordmark .wm-au{color:#378ADD}
.sb-group-label{display:none}
[data-sb="open"] .sb-group-label{display:block;font-family:"IBM Plex Mono",monospace;font-size:9px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.5);padding:14px 12px 6px;align-self:stretch}
.sb-divider{width:24px;height:1px;background:rgba(255,255,255,.06);margin:6px 0}
[data-sb="open"] .sb-divider{display:none}
.sb-icon{width:36px;height:36px;border-radius:9px;display:grid;place-items:center;color:rgba(255,255,255,.6);position:relative;cursor:pointer;transition:all .15s;text-decoration:none;border:0;background:transparent;font:inherit;padding:0}
.sb-icon:hover{background:rgba(255,255,255,.06);color:#e2e8f0}
.sb-icon.active{background:rgba(55,138,221,.15);color:#fff;box-shadow:inset 2px 0 0 #378ADD}
.sb-icon.active::before{content:"";position:absolute;left:-10px;top:6px;bottom:6px;width:2px;background:#378ADD;border-radius:2px}
.sb-icon > svg{width:18px;height:18px;flex-shrink:0}
.sb-icon .sb-label,.sb-icon .sb-badge{display:none}
.sb-tip{position:absolute;left:calc(100% + 12px);top:50%;transform:translateY(-50%);background:#050d1a;color:#fff;padding:5px 10px;border-radius:6px;font-size:11px;font-weight:600;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .14s,transform .14s;box-shadow:0 6px 18px rgba(0,0,0,.3);z-index:300;letter-spacing:.01em}
.sb-tip::before{content:"";position:absolute;left:-3px;top:50%;transform:translateY(-50%) rotate(45deg);width:6px;height:6px;background:#050d1a}
.sb-icon:hover .sb-tip{opacity:1;transform:translateY(-50%) translateX(2px)}
[data-sb="open"] .sb-icon .sb-tip{display:none!important}
[data-sb="open"] .sidebar{align-items:stretch;padding:14px 10px 14px}
[data-sb="open"] .sb-icon{display:flex!important;align-items:center!important;justify-content:flex-start!important;width:100%!important;height:36px;gap:11px!important;padding:0 10px!important;border-radius:9px;flex-direction:row!important}
[data-sb="open"] .sb-icon > svg{flex-shrink:0;width:18px;height:18px}
[data-sb="open"] .sb-icon .sb-label{display:inline-flex!important;align-items:center;font-size:12.5px;font-weight:500;letter-spacing:.005em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.1;flex:1 1 auto;min-width:0}
[data-sb="open"] .sb-icon.active{background:rgba(181,212,244,.08);color:#fff;box-shadow:none}
[data-sb="open"] .sb-icon.active::before{display:none}
[data-sb="open"] .sb-icon.active svg{color:#378ADD}
[data-sb="open"] .sb-icon .sb-badge{display:inline-flex!important;align-items:center;justify-content:center;font-family:"IBM Plex Mono",monospace;font-size:9.5px;font-weight:700;letter-spacing:.02em;padding:2px 7px;border-radius:5px;flex-shrink:0;line-height:1;white-space:nowrap}
[data-sb="open"] .sb-icon .sb-badge.count{background:rgba(255,255,255,.08);color:rgba(255,255,255,.78)}
[data-sb="open"] .sb-icon .sb-badge.new{background:#2F73BC;color:#fff}
[data-sb="open"] .sb-icon .sb-badge.live{background:rgba(16,185,129,.18);color:#86efac;gap:4px;padding-left:5px}
[data-sb="open"] .sb-icon .sb-badge.live::before{content:"";width:5px;height:5px;border-radius:50%;background:#10b981;flex-shrink:0}
[data-sb="open"] .sb-icon .sb-badge.danger{background:rgba(220,38,38,.18);color:#fca5a5;border:1px solid rgba(220,38,38,.3)}
.sb-icon.sb-signout:hover{color:#fca5a5}
[data-sb="open"] .sb-icon.sb-signout:hover{color:#fca5a5;background:rgba(220,38,38,.08)}
.sb-bottom{margin-top:auto;display:flex;flex-direction:column;gap:6px;align-items:center}
[data-sb="open"] .sb-bottom{align-items:flex-start;width:100%;padding:0 4px}
.sb-avatar{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,#64748b,#334155);display:grid;place-items:center;color:#fff;font-weight:700;font-size:12px;border:1.5px solid rgba(255,255,255,.06)}
</style>
</head>
<body>

<div class="geo-tip" id="bubTip" style="position:fixed;z-index:200;display:none;pointer-events:none;background:#050d1a;color:#fff;padding:9px 11px;border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.35);min-width:160px"></div>

<div class="frame">

  <aside class="sidebar"><!-- Placeholder only: replaced at serve time by src/lib/nav/rail.ts injectRail() (single source of truth for the rail — no hardcoded badges here). --></aside>

  <main class="main">
    <div class="topbar">
      <div class="crumbs"><b>Opportunities</b><span class="sep">/</span><span>Pursuit Intelligence</span></div>
      <span class="live-pill" id="livePill">LIVE</span>
      <button class="tb-search" id="tbSearch" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:14px;height:14px;flex-shrink:0"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        <span>Filter notices…</span><span class="kbd">⌘K</span>
      </button>
      <div class="top-actions">
        <button class="icon-btn" id="themeToggle" title="Toggle theme" aria-label="Toggle theme">
          <svg id="themeSun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
          <svg id="themeMoon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none"><path d="M21 12.8A9 9 0 1111.2 3 7 7 0 0021 12.8z"/></svg>
        </button>
        <div style="position:relative">
          <button class="icon-btn" id="bellBtn" title="Notifications" aria-haspopup="true" aria-expanded="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 8a6 6 0 1112 0c0 7 3 8 3 8H3s3-1 3-8z"/><path d="M10 21a2 2 0 004 0"/></svg><span class="nbadge" style="display:none"></span></button>
          <div id="bellMenu" hidden style="position:absolute;right:0;top:42px;width:320px;max-height:380px;overflow-y:auto;background:var(--card);border:1px solid var(--line);border-radius:11px;box-shadow:var(--shadow-pop);z-index:120;padding:6px"></div>
        </div>
        <div class="user-chip"><div class="av"></div><div><div class="nm"></div></div></div>
      </div>
    </div>

    <div class="body">
      <header class="page-header">
        <div class="heading">
          <p class="eyebrow">Live from SAM.gov</p>
          <h1>Opportunities</h1>
          <p class="sub" id="feedMeta"></p>
        </div>
        <div class="profile">
          <span class="prof-label" id="hdrNaicsLabel">Your NAICS codes · click to filter</span>
          <div class="prof-pills" id="hdrNaics"></div>
          <div class="prof-gap" id="profileGap"></div>
        </div>
      </header>

      <section class="controls">
        <span class="ctl-label">Notice type</span>
        <div class="seg" id="stageSeg"></div>
        <span class="ctl-label">Set-aside</span>
        <div class="ctl-field"><div class="seg" id="saFilters"></div><button class="more-btn" id="saMore" type="button"></button></div>
        <div class="ctl-sep"></div>
        <span class="ctl-label">Saved views</span>
        <div class="ctl-field">
          <div class="pillset" id="savedViews"></div>
          <div class="vr-right">
            <div class="ctl-search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg><input id="searchInput" type="text" placeholder="Filter notices…" /></div>
            <button class="reset-btn" id="resetBtn">Reset all</button>
          </div>
        </div>
      </section>

      <section class="kpi-strip" id="kpiStrip"></section>

      <section class="row hero">
        <section class="widget">
          <header class="widget-head">
            <div class="wh-text"><h3 id="triageTitle"></h3><p class="wh-sub">Every notice sits in exactly one band. Each band states the rule that put it there. Click a band to filter the list.</p></div>
            <span class="wh-source">Derived</span>
          </header>
          <div class="bands" id="triageBands"></div>
        </section>

        <section class="widget">
          <header class="widget-head">
            <div class="wh-text"><h3>Closing first</h3><p class="wh-sub" id="actSub"></p></div>
          </header>
          <div class="act-list" id="actList"></div>
          <p class="act-foot" id="actFoot"></p>
        </section>

<script>
(function(){
  var root=document.documentElement, sun=document.getElementById('themeSun'), moon=document.getElementById('themeMoon'), btn=document.getElementById('themeToggle');
  function sync(){ if(!sun||!moon) return; var t=root.getAttribute('data-theme'); if(t==='light'){sun.style.display='none';moon.style.display='';} else {sun.style.display='';moon.style.display='none';} }
  try{ var saved=localStorage.getItem('faraudit-theme'); if(saved) root.setAttribute('data-theme',saved); }catch(e){}
  sync();
  if(btn) btn.addEventListener('click', function(){ var next=root.getAttribute('data-theme')==='light'?'dark':'light'; root.setAttribute('data-theme',next); try{localStorage.setItem('faraudit-theme',next);}catch(e){} sync(); if(window.DSO_APP)window.DSO_APP.onThemeChange(); });
})();
(function(){
  var KEY='faraudit-sb', html=document.documentElement;
  try{var s=localStorage.getItem(KEY); if(s==='closed') html.setAttribute('data-sb','closed'); else if(!html.hasAttribute('data-sb')) html.setAttribute('data-sb','open');}catch(e){}
  document.addEventListener('click',function(e){
    var t=e.target&&e.target.closest&&e.target.closest('#sbToggle'); if(!t) return;
    var next=html.getAttribute('data-sb')==='open'?'closed':'open';
    html.setAttribute('data-sb',next);
    try{localStorage.setItem(KEY,next);}catch(e){}
  });
})();
</script>
<script>
/* ⌘K / topbar search → focuses the pursuit filter input (the page's one search). */
(function(){
  var btn=document.getElementById('tbSearch');
  function focusFilter(){var i=document.getElementById('searchInput');if(!i)return;i.scrollIntoView({block:'center',behavior:'smooth'});i.focus();}
  if(btn)btn.addEventListener('click',focusFilter);
  document.addEventListener('keydown',function(e){if((e.metaKey||e.ctrlKey)&&(e.key==='k'||e.key==='K')){e.preventDefault();focusFilter();}});
})();
/* The bell is owned by /notifications-chrome.js (shared chrome). */
</script>
<script src="/notifications-chrome.js" defer></script>
